name = "problems"
defaultTargets = ["Problems", "Tests"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.31.0"

[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "v4.31.0"

[[lean_lib]]
name = "Problems"

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]
